<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Marble – Marble.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; color: #eee; }
    h1 { margin-bottom: 12px; }
    canvas { border-radius: 4px; }
  </style>
</head>
<body>
  <h1>DVD Screensaver Mode</h1>
  <script src="../../dist/marble.js"></script>
  <script>
    const game = new Marble.Game({
      width: 960,
      height: 540,
      gravity: 0,
      background: '#0a0a12',
      boundsMode: 'bounce'
    });

    // Multiple DVD-style balls
    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#1abc9c'];
    for (let i = 0; i < 6; i++) {
      const ball = new Marble.Ball({
        x: 100 + i * 120,
        y: 100 + (i % 3) * 80,
        radius: 28,
        color: colors[i],
        physics: 'dvd',
        speed: 180 + i * 30,
        name: colors[i],
        showName: false,
        trail: true
      });
      game.add(ball);
    }

    game.add(new Marble.Text({
      x: 20, y: 20, text: 'physics: "dvd"', color: '#888', size: 16
    }));

    game.start();
  </script>
</body>
</html>
