<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleport Race – Marble.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1220; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; color: #eee; }
    h1 { margin-bottom: 12px; color: #00ffff; }
  </style>
</head>
<body>
  <h1>TELEPORT RACE</h1>
  <script src="../../dist/marble.js"></script>
  <script>
    const game = new Marble.Game({
      width: 1280,
      height: 720,
      gravity: 850,
      background: '#0a1220'
    });

    // Platforms
    game.add(new Marble.Rectangle({ x: 0, y: 200, width: 400, height: 20, color: '#2c3e50' }));
    game.add(new Marble.Rectangle({ x: 500, y: 350, width: 300, height: 20, color: '#2c3e50' }));
    game.add(new Marble.Rectangle({ x: 900, y: 500, width: 380, height: 20, color: '#2c3e50' }));
    game.add(new Marble.Rectangle({ x: 0, y: 680, width: 1280, height: 40, color: '#1a252f' }));

    // Teleports chain
    game.add(new Marble.BallTeleport({ x: 350, y: 160, targetX: 550, targetY: 300, radius: 20 }));
    game.add(new Marble.BallTeleport({ x: 750, y: 310, targetX: 1000, targetY: 450, radius: 20 }));

    // Goal
    game.add(new Marble.Goal({ x: 1150, y: 460, radius: 40 }));

    // Ice surface
    game.add(new Marble.Rectangle({
      x: 100, y: 670, width: 400, height: 15,
      color: '#a8d8ea',
      surface: { friction: 0.02, bounce: 0.3 }
    }));

    for (let i = 0; i < 10; i++) {
      game.add(new Marble.Ball({
        x: 50 + i * 35,
        y: 80,
        radius: 16,
        color: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'][i % 5],
        name: 'M' + (i + 1),
        showName: true,
        bounce: 0.7,
        physics: 'real'
      }));
    }

    game.add(new Marble.Text({
      x: 20, y: 20, text: 'Use teleports!', color: '#00ffff', size: 22, bold: true
    }));

    game.start();
  </script>
</body>
</html>
